[versions]
# ── SDK & toolchain ───────────────────────────────────────────────────────────
agp                        = "8.5.2"
kotlin                     = "2.0.21"
ksp                        = "2.0.21-1.0.27"

# ── AndroidX core ─────────────────────────────────────────────────────────────
coreKtx                    = "1.13.1"
activityCompose            = "1.9.2"
lifecycleRuntimeKtx        = "2.8.6"
lifecycleViewmodelCompose  = "2.8.6"

# ── Compose BOM ───────────────────────────────────────────────────────────────
composeBom                 = "2024.09.03"

# ── Navigation ────────────────────────────────────────────────────────────────
navigationCompose          = "2.8.2"

# ── Room ──────────────────────────────────────────────────────────────────────
room                       = "2.6.1"

# ── Hilt ──────────────────────────────────────────────────────────────────────
hilt                       = "2.52"
hiltNavigationCompose      = "1.2.0"
hiltWork                   = "1.2.0"

# ── WorkManager — used for daily due-date notification checks ─────────────────
workManager                = "2.9.1"

# ── Firebase BOM — manages all Firebase library versions ─────────────────────
# Check latest: https://firebase.google.com/docs/android/setup#available-libraries
firebaseBom                = "33.5.1"

# ── DataStore ─────────────────────────────────────────────────────────────────
datastore                  = "1.1.1"

# ── Coroutines ────────────────────────────────────────────────────────────────
coroutines                 = "1.9.0"

# ── Testing ───────────────────────────────────────────────────────────────────
junit                      = "4.13.2"
androidxTestExt            = "1.2.1"
espressoCore               = "3.6.1"
archCoreTesting            = "2.2.0"
turbine                    = "1.1.0"
mockk                      = "1.13.12"
coroutinesTest             = "1.9.0"
roomTesting                = "2.6.1"

[libraries]
# ── AndroidX core ─────────────────────────────────────────────────────────────
androidx-core-ktx                     = { group = "androidx.core",      name = "core-ktx",                    version.ref = "coreKtx" }
androidx-activity-compose             = { group = "androidx.activity",  name = "activity-compose",            version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx        = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",       version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose  = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose    = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycleViewmodelCompose" }

# ── Compose BOM and UI ────────────────────────────────────────────────────────
androidx-compose-bom         = { group = "androidx.compose",          name = "compose-bom",              version.ref = "composeBom" }
androidx-ui                  = { group = "androidx.compose.ui",       name = "ui" }
androidx-ui-graphics         = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-ui-tooling-preview  = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
androidx-ui-tooling          = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-ui-test-manifest    = { group = "androidx.compose.ui",       name = "ui-test-manifest" }
androidx-ui-test-junit4      = { group = "androidx.compose.ui",       name = "ui-test-junit4" }
androidx-material3           = { group = "androidx.compose.material3",name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# ── Navigation ────────────────────────────────────────────────────────────────
androidx-navigation-compose  = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ── Room ──────────────────────────────────────────────────────────────────────
androidx-room-runtime        = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
androidx-room-ktx            = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
androidx-room-compiler       = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing        = { group = "androidx.room", name = "room-testing",  version.ref = "roomTesting" }

# ── Hilt ──────────────────────────────────────────────────────────────────────
hilt-android                 = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-android-compiler        = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose      = { group = "androidx.hilt",     name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
hilt-work                    = { group = "androidx.hilt",     name = "hilt-work",     version.ref = "hiltWork" }
hilt-compiler                = { group = "androidx.hilt",     name = "hilt-compiler", version.ref = "hiltWork" }

# ── WorkManager ───────────────────────────────────────────────────────────────
androidx-work-runtime-ktx    = { group = "androidx.work",     name = "work-runtime-ktx", version.ref = "workManager" }

# ── Firebase BOM — single BOM controls all Firebase versions ─────────────────
firebase-bom                 = { group = "com.google.firebase", name = "firebase-bom",              version.ref = "firebaseBom" }
firebase-auth-ktx            = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-database-ktx        = { group = "com.google.firebase", name = "firebase-database-ktx" }
firebase-storage-ktx         = { group = "com.google.firebase", name = "firebase-storage-ktx" }
firebase-analytics-ktx       = { group = "com.google.firebase", name = "firebase-analytics-ktx" }

# ── DataStore ─────────────────────────────────────────────────────────────────
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ── Coroutines ────────────────────────────────────────────────────────────────
kotlinx-coroutines-android   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ── Testing ───────────────────────────────────────────────────────────────────
junit                        = { group = "junit",                  name = "junit",              version.ref = "junit" }
androidx-test-ext-junit      = { group = "androidx.test.ext",      name = "junit",              version.ref = "androidxTestExt" }
androidx-espresso-core       = { group = "androidx.test.espresso", name = "espresso-core",      version.ref = "espressoCore" }
androidx-arch-core-testing   = { group = "androidx.arch.core",     name = "core-testing",       version.ref = "archCoreTesting" }
turbine                      = { group = "app.cash.turbine",       name = "turbine",            version.ref = "turbine" }
mockk                        = { group = "io.mockk",               name = "mockk",              version.ref = "mockk" }
kotlinx-coroutines-test      = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application   = { id = "com.android.application",             version.ref = "agp" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                   = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
hilt                  = { id = "com.google.dagger.hilt.android",       version.ref = "hilt" }
google-services       = { id = "com.google.gms.google-services",      version = "4.4.2" }
